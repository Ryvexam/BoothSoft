# BoothSoft theme manifest. Assets are relative to this theme directory.
# Do not put secrets, tokens, or absolute filesystem paths here.
schema_version = 1
name = "Party"

[colors]
background = "#24173E"
foreground = "#FFF6EC"
primary = "#FFC857"
accent = "#F0477D"
surface = "#33245A"
muted = "#BBAED6"

[assets]
logo = "assets/logo.png"
frame = "assets/frame.png"
frame_portrait = "assets/frame-portrait.png"
background = "assets/background.png"

[ui]
# Texts below are in French; [ui.en] gives the English ones.
language = "fr"
shutter_label = "Prendre la photo"
retake_label = "Reprendre"
finish_label = "Terminer"
print_label = "Imprimer"
start_label = "On y va !"
welcome_eyebrow = "Photobooth"
welcome_title = "Que la fête\ncommence !"
welcome_subtitle = "Grimaces, câlins, pas de danse : tout est permis."
thanks_title = "Trop bien !"
thanks_subtitle = "Votre photo arrive. Allez vite danser !"

[ui.en]
shutter_label = "Take the photo"
retake_label = "Retake"
finish_label = "Done"
print_label = "Print"
start_label = "Let's go!"
welcome_eyebrow = "Photobooth"
welcome_title = "Let the party\nbegin!"
welcome_subtitle = "Silly faces, hugs, dance moves: anything goes."
thanks_title = "Awesome!"
thanks_subtitle = "Your photo is on its way. Go dance!"
